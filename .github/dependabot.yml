version: 2
updates:
  # The CI actions are pinned by commit; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # npm packages: one grouped pull request a month (CI also runs npm audit on each change).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Minor and patch updates only, in one group. React, React Native and Expo move together with an Expo
    # SDK upgrade, which is done by hand (the root package.json pins them with overrides).
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 1
