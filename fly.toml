# The reference deployment: the TrustPhoto server and website on Fly.io (https://trustphoto.fly.dev).
# For your own deployment, change the app name and every value under [env].
# The values here are identifiers, not secrets. Secrets (database, bucket, signing key, URL secret,
# Play Integrity key, the settings of the photo checks) are set with `fly secrets set`.
app = 'trustphoto'
primary_region = 'arn'
# A capture may take up to 90 s to arrive and be checked. Let open requests finish before a deploy stops the machine.
kill_timeout = 120

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  PUBLIC_BASE_URL = 'https://trustphoto.fly.dev'
  CLIENT_IP_HEADER = 'fly-client-ip'
  APP_ATTEST_APP_ID = 'TC3G35G4CC.com.socialhuman.trustphoto'
  PLAY_INTEGRITY_PACKAGE_NAME = 'com.socialhuman.trustphoto'
  OPERATOR_NAME = 'SocialHuman Technologies Oy'
  CONTACT_EMAIL = 'hello@socialhuman.dev'
  # One verification at a time: each decodes a full photo, and the machine has 1 GB.
  VERIFY_CONCURRENCY = '1'
  MAX_UPLOADS_IN_FLIGHT = '8'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the per-install and per-address rate limits are counted in memory, and a stopped machine forgets them.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
